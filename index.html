<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Printivo</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="phone.css" />
  </head>
  <body>
    <div class="top-bar-container">
      <div class="top-bar">
        <div class="top-bar-left">
          <a href="#">Cost Calculator</a>
          <a href="#">Discover Stores</a>
          <a href="#">Track Orders</a>
        </div>

        <div class="top-bar-right">
          <div class="top-bar-right-child">
            <div class="top-bar-right-child-subchild">
              <p>Need help? Call:</p>
              <div>
                <a href="tel:+2347069000083">+2347069000083</a>
                <p class="para">or</p>
                <a href="tel:+2349035000505">+2349035000505</a>
              </div>
            </div>

            <img
              src="images/whatsapplogo.svg"
              alt=""
              class="top-bar-right-child2"
            />

            <div class="country">
              <img src="images/Nigeria-flag.svg" alt="" />
              <p>Nigeria</p>
            </div>
          </div>

          <div class="country">
            <img src="images/UK-flag.svg" alt="" />
            <p>UK</p>
          </div>
        </div>
      </div>
    </div>

    <header>
      <div class="header-inner">
        <nav>
          <img src="images/printivo-logo.svg" alt="" />

          <div class="nav-right">
            <div class="nav-right-child">
              <a href="#">All Products</a>
              <a href="#">Become a Reseller</a>
              <a href="#">Merch Store</a>
              <a href="#">Marketplace</a>
            </div>

            <div class="nav-right-child2">
              <a href="#">Sign In</a>
              <a href="#">Create Account</a>
              <img src="images/cart.svg" alt="" />
            </div>
          </div>
        </nav>
      </div>
    </header>

    <main>
      <div class="hero">
        <div class="hero-content">
          <h2>Quality Prints</h2>
          <h3>Shipped to your doorstep</h3>

          <div class="hero-cont-child2">
            <p>What would you like to print today?</p>
            <input
              type="text"
              placeholder="Search for Business cards, T-shirts, Mugs, etc"
            />
            <img src="images/search-icon.svg" alt="" class="search-img" />
          </div>
        </div>
        <img src="images/hand.png" alt="" />
      </div>
    </main>
  </body>
</html>
